{% extends "base.html" %}

{% block title %}{{ 'Edit' if artist else 'Add New' }} Artist - Music Wrapped{% endblock %}

{% block content %}
<div class="container">
    <div class="back-button">
        <a href="{{ url_for('content_manager.artists') }}"><i class="fas fa-arrow-left"></i> Back to Artists</a>
    </div>

    <div class="form-container">
        <h1>
            <i class="fas fa-microphone"></i>
            {{ 'Edit Artist: ' + artist.name if artist else 'Add New Artist' }}
        </h1>

        <form method="POST" class="content-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Artist Name <span class="required">*</span></label>
                    <input type="text" id="name" name="name" 
                           value="{{ artist.name if artist else '' }}" 
                           required maxlength="25">
                </div>

                <div class="form-group">
                    <label for="artist_type">Artist Type <span class="required">*</span></label>
                    <select id="artist_type" name="artist_type" required>
                        <option value="Solo" {{ 'selected' if artist and artist.artist_type == 'Solo' else '' }}>Solo</option>
                        <option value="Band" {{ 'selected' if artist and artist.artist_type == 'Band' else '' }}>Band</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="country">Country <span class="required">*</span></label>
                    <select id="country" name="country" required>
                        {% set countries = ['Greece', 'USA', 'UK', 'Germany', 'France', 'Spain', 'Italy', 'Other'] %}
                        {% for country in countries %}
                            <option value="{{ country }}" {{ 'selected' if artist and artist.country == country else '' }}>
                                {{ country }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="formation_date">Formation Date <span class="required">*</span></label>
                    <input type="date" id="formation_date" name="formation_date" 
                           value="{{ artist.formation_date.strftime('%Y-%m-%d') if artist else '' }}" 
                           required>
                </div>
            </div>

            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="active_status" 
                           {{ 'checked' if not artist or artist.active_status else '' }}>
                    Active Artist
                </label>
                <p class="form-help">Uncheck if the artist is no longer active</p>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i>
                    {{ 'Update Artist' if artist else 'Create Artist' }}
                </button>
                <a href="{{ url_for('content_manager.artists') }}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<style>
.form-container {
    max-width: 800px;
    margin: 0 auto;
    background-color: var(--card-bg);
    padding: 40px;
    border-radius: 12px;
}

.form-container h1 {
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--hover-bg);
}

.content-form {
    margin-top: 20px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
}

.required {
    color: var(--error-color);
}

.form-group input[type="text"],
.form-group input[type="date"],
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 12px;
    background-color: var(--bg-color);
    border: 1px solid #404040;
    border-radius: 6px;
    color: var(--text-color);
    font-size: 1rem;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--primary-color);
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
}

.checkbox-label input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
}

.form-help {
    color: #b3b3b3;
    font-size: 0.85rem;
    margin-top: 5px;
}

.form-actions {
    display: flex;
    gap: 15px;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--hover-bg);
}

.btn-secondary {
    background-color: #666;
    color: #fff;
}

.btn-secondary:hover {
    background-color: #555;
}

@media (max-width: 768px) {
    .form-row {
        grid-template-columns: 1fr;
    }
    
    .form-container {
        padding: 20px;
    }
}
</style>
{% endblock %}
