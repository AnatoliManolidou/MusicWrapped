{% extends "base.html" %}

{% block title %}SYSTEM LOGIN - Music Wrapped{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box" data-title="SYSTEM-ACCESS">
        <div class="auth-header">
            <i class="fas fa-terminal"></i>
            <h1>MUSIC WRAPPED</h1>
            <p>&gt; SYSTEM LOGIN v1.0</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> USERNAME
                </label>
                <input type="text" id="username" name="username" required placeholder="Enter username...">
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> PASSWORD
                </label>
                <input type="password" id="password" name="password" required placeholder="Enter password...">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-sign-in-alt"></i> ACCESS SYSTEM
            </button>
        </form>

        <div class="auth-footer">
            <p>&gt; NO ACCOUNT? <a href="{{ url_for('auth.register') }}">REGISTER_NEW_USER</a></p>
        </div>

        <div class="demo-credentials">
              <h3>DEMO ACCOUNTS:</h3>
              <p><strong>&gt; END_USER:</strong> pierre_frt / Pierre@33</p>
              <p><strong>&gt; CONTENT_MGR:</strong> maria_bel / Maria_It3</p>
        </div>
    </div>
</div>

<style>
.auth-box {
    animation: terminalBoot 0.5s ease-out;
}

@keyframes terminalBoot {
    0% {
        opacity: 0;
        transform: scale(0.95);
    }
    50% {
        opacity: 0.5;
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}
</style>
{% endblock %}
